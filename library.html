<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>المكتبة الإلكترونية | V7</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body style="background:#f8fafc">
  <header class="navbar">
    <div class="nav-brand">
      <div class="logo-icon" style="background:var(--success);"><i class="fa-solid fa-book-open-reader"></i></div>
      <div class="brand-text">
        <h1>المكتبة الإلكترونية</h1><span>مصادر التعلم والكتب الدراسية</span>
      </div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">العودة للرئيسية</a></li>
    </ul>
  </header>
  <div style="padding: 50px 20px;">
    <div class="filter-container" id="libraryFilters">
      <button class="filter-btn active" onclick="filterLibrary('الكل')">الكل</button>
      <button class="filter-btn" onclick="filterLibrary('عام')">القسم العام</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الأول الابتدائي')">1 ابتدائي</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الثاني الابتدائي')">2 ابتدائي</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الثالث الابتدائي')">3 ابتدائي</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الأول الإعدادي')">1 إعدادي</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الثاني الإعدادي')">2 إعدادي</button>
      <button class="filter-btn" onclick="filterLibrary('الصف الثالث الإعدادي')">3 إعدادي</button>
    </div>
    <div class="news-grid" id="publicLibraryFeed">جاري تحميل المواد العلمية...</div>
  </div>
  <script src="js/main.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => loadPublicLibrary('الكل'));</script>
</body>

</html>
