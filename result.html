<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>استعلام النتيجة</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body style="background:#f1f5f9;min-height:100vh;">
<header class="navbar"><div class="nav-brand"><div class="logo-icon" style="background:#8b5cf6;"><i class="fa-solid fa-magnifying-glass-chart"></i></div><div class="brand-text"><h1>بوابة النتائج وشؤون الطلبة</h1></div></div><ul class="nav-links"><li><a href="index.html">الرئيسية</a></li></ul></header>
<div style="padding:60px 20px; display:flex; justify-content:center;"><div style="background:white;padding:40px;border-radius:20px;width:100%;max-width:700px;box-shadow:var(--shadow-md);">
<h3 style="text-align:center;margin-bottom:25px;font-size:1.8rem;color:var(--primary-dark);"><i class="fa-solid fa-id-card"></i> استعلام برقم الجلوس أو الكود</h3>
<form id="checkResultForm" style="display:flex;gap:15px;"><input type="text" id="searchCode" class="form-control" placeholder="أدخل كود الطالب هنا..." required style="font-size:1.1rem;"><button type="submit" class="btn-primary" style="padding:0 30px!important;font-size:1.1rem;">بحث</button></form>
<div id="resCard" style="display:none;margin-top:40px;padding:30px;border:3px solid var(--primary-light);border-radius:16px;text-align:center;position:relative;background:#f8fafc;">
<i class="fa-solid fa-award" style="font-size:3rem;color:var(--accent);margin-bottom:15px;display:inline-block;"></i>
<h3 style="color:var(--primary-dark);margin-bottom:15px;font-size:1.5rem;font-weight:900;">شهادة بيان درجات رسمي</h3>
<div style="display:flex;justify-content:space-around;background:white;padding:15px;border-radius:10px;margin-bottom:25px;font-weight:700;box-shadow:var(--shadow-sm);"><span>الاسم: <span id="resName" style="color:var(--primary)"></span></span><span>الكود: <span id="resCode"></span></span><span>الصف: <span id="resGrade" style="color:var(--primary-dark)"></span></span></div>
<table class="pro-table" style="background:white;border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:25px;">
<thead style="background:var(--primary-dark);color:white;"><tr><th style="color:white">عربي</th><th style="color:white">انجليزي</th><th style="color:white">رياضة</th><th style="color:white">علوم</th><th style="color:white">دراسات</th><th style="color:var(--accent)">المجموع</th></tr></thead>
<tbody><tr><td id="resAr" style="font-weight:800;font-size:1.1rem;"></td><td id="resEn" style="font-weight:800;font-size:1.1rem;"></td><td id="resMa" style="font-weight:800;font-size:1.1rem;"></td><td id="resSc" style="font-weight:800;font-size:1.1rem;"></td><td id="resSo" style="font-weight:800;font-size:1.1rem;"></td><td id="resTotal" style="font-weight:900;font-size:1.2rem;color:var(--primary-dark);"></td></tr></tbody></table>
<div style="background:#fee2e2; color:#b91c1c; padding:15px; border-radius:10px; font-weight:800; font-size:1.1rem; border:1px solid #fca5a5;"><i class="fa-solid fa-triangle-exclamation"></i> إجمالي أيام الغياب المسجلة بالكنترول: <span id="resAbsence" style="font-size:1.3rem;">0</span> أيام</div>
<button class="btn-outline" style="margin-top:25px;" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الشهادة</button>
</div></div></div><div id="toast"></div><script src="js/main.js"></script></body></html>
